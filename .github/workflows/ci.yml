name: ApplySignal CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --no-save

      - name: Run tests
        run: bun test

      - name: Build application entrypoints
        run: |
          bun build src/index.ts --target bun --outdir /tmp/applysignal-root-build
          bun build src/cli/run-collector.ts --target bun --outdir /tmp/applysignal-collector-build

      - name: Run credit-free health demo
        run: bun run demo:health

      - name: Seed the local fixture and audit it
        run: |
          bun run seed:fixture
          bun run audit

      - name: Check patch formatting
        run: git diff --check
