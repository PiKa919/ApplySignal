name: Bright Data collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Use zero-credit public preflight, or deliberately enable one paid collector run"
        required: true
        type: choice
        options:
          - preflight
          - paid
        default: preflight
      source_id:
        description: "ApplySignal source ID"
        required: true
        default: zfh
        type: string
      collector_id:
        description: "Bright Data collector ID (required only for paid mode)"
        required: false
        type: string
      target_url:
        description: "Public source URL to preflight or collect"
        required: true
        default: https://careers.zerodhafundhouse.com/jobs
        type: string
      expected_host:
        description: "Expected final hostname; leave blank to derive it from target_url"
        required: false
        type: string
      paid_confirmation:
        description: "Type RUN_PAID_COLLECTION only when you accept a Bright Data collection call"
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: inputs.mode == 'preflight' || (inputs.mode == 'paid' && inputs.paid_confirmation != 'RUN_PAID_COLLECTION')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --no-save

      - name: Run zero-credit public preflight
        env:
          APPLYSIGNAL_PREFLIGHT_SOURCE_ID: ${{ inputs.source_id }}
          APPLYSIGNAL_PREFLIGHT_URL: ${{ inputs.target_url }}
          APPLYSIGNAL_PREFLIGHT_EXPECTED_HOST: ${{ inputs.expected_host }}
        run: bun run preflight

      - name: Explain paid-run guard
        if: inputs.mode == 'paid'
        run: echo "Paid mode was requested without the exact RUN_PAID_COLLECTION confirmation; no Bright Data call was made."

  paid-collector:
    if: inputs.mode == 'paid' && inputs.paid_confirmation == 'RUN_PAID_COLLECTION'
    runs-on: ubuntu-latest
    environment: brightdata-paid
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install project dependencies
        run: bun install --no-save

      - name: Install Bright Data CLI
        run: |
          bun add --global @brightdata/cli
          echo "$(bun pm bin -g)" >> "$GITHUB_PATH"
          brightdata --version

      - name: Authenticate Bright Data on the runner
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: brightdata login --api-key "$BRIGHTDATA_API_KEY"

      - name: Run the explicitly approved collector
        env:
          BRIGHTDATA_COLLECTOR_ID: ${{ inputs.collector_id }}
          BRIGHTDATA_SOURCE_ID: ${{ inputs.source_id }}
          BRIGHTDATA_SOURCE_URL: ${{ inputs.target_url }}
          BRIGHTDATA_TARGET_URL: ${{ inputs.target_url }}
          BRIGHTDATA_EXPECTED_HOST: ${{ inputs.expected_host }}
          BRIGHTDATA_MIN_ROWS: "1"
          BRIGHTDATA_SCOPE_KIND: all_jobs
          APPLYSIGNAL_DB: data/applysignal.db
          APPLYSIGNAL_PREFLIGHT_MODE: required
          APPLYSIGNAL_FORCE_PAID_RUN: "true"
        run: |
          test -n "$BRIGHTDATA_COLLECTOR_ID"
          bun run run:collector
