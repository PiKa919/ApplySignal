services:
  - type: web
    name: applysignal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # GitHub Actions remains the validation gate; Render deploys the validated commit.
    autoDeployTrigger: commit
    healthCheckPath: /api/summary
    envVars:
      - key: APPLYSIGNAL_DB
        value: /tmp/applysignal.db
